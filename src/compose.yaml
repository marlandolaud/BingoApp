# docker compose up --build   -> UI on http://localhost:${UI_PORT:-8080}, public via ngrok
# Copy .env.example to .env first (ngrok token + basic auth credentials).
services:
  # Migrations run on API startup; with several API replicas, run them as a separate step instead.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bingo}
      POSTGRES_DB: bingo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bingo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: bingobongo
    build:
      context: .
      dockerfile: BingoBongo/Dockerfile
    environment:
      ConnectionStrings__Bingo: Host=db;Database=bingo;Username=postgres;Password=${POSTGRES_PASSWORD:-bingo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # not published: only reachable through the ui proxy

  ui:
    image: bingobongo-ui
    build:
      context: UI
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"

  ngrok:
    image: ngrok/ngrok:3
    depends_on:
      - ui
    entrypoint: ["sh", "/ngrok/start.sh"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
    volumes:
      - ./ngrok:/ngrok:ro
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"   # local inspector, shows the public URL
    restart: on-failure:3

volumes:
  pgdata:
